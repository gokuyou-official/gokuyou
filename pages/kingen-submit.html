    background: var(--bg);

    margin: 0 auto;

  .page-header {
    background: linear-gradient(135deg, #FF6B35 0%, #FFB347 100%);

  .page-header::before {

    position: absolute;
    top: -50px; right: -50px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);

  }
  .page-header h1 {

    line-height: 1.45;

    position: relative;
  }
  .page-header p {
    font-size: 14px;
    opacity: 0.9;
    margin-top: 10px;
    line-height: 1.7;
  }
  .form-card {
    background: var(--card);
    margin: -14px 16px 0;
    border-radius: 18px;
    padding: 28px 22px 32px;
    position: relative;
    border: 1px solid var(--border);
  }
  .form-group {
    margin-bottom: 22px;
  }
  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 7px;
    color: var(--text);
  }
  .form-label .required {
    color: var(--primary);
    margin-left: 4px;
    font-size: 12px;
  }
  .form-label .optional {
    color: var(--text3);
    margin-left: 4px;
    font-size: 12px;
    font-weight: 400;
  }
  .form-input, .form-textarea {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;

  .form-input:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--primary);
  }

    color: var(--text3);
    margin-top: 4px;
  }
  .char-count.over { color: #e02020; }
  .consent-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px;
    background: var(--primary-bg);
    border-radius: 10px;
  }
  .consent-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 2px;
    accent-color: var(--primary);
    cursor: pointer;
  }
  .consent-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text2);
  }
  .submit-btn {
    display: block;
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    margin-top: 24px;
    transition: opacity 0.15s;
  }
  .submit-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .submit-btn:not(:disabled):hover { opacity: 0.88; }
  .submit-btn:focus-visible { outline: 3px solid #2D6BE4; outline-offset: 2px; }
  .result-msg {
    display: none;
    margin-top: 18px;
    padding: 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.7;
    text-align: center;
    font-weight: 700;
  }
  .result-msg.success {
    background: #E8F5E9;
    color: #2E7D32;
    border: 1px solid #A5D6A7;
  }
  .result-msg.error {
    background: #FFEBEE;
    color: #c62828;

    display: grid;

<body>

<header class="page-header">
  <a class="header-back" href="/gokuyou/gokuyou_kingen">← 敗北者の金言へ戻る</a>
  <h1>金言を投稿する</h1>
  <p>夢を諦めた日に思ったこと、一言でOK。<br>名前不要、匿名で投稿できます。</p>
</header>

<div class="form-card">
  <form id="kingen-form" novalidate>

    <div class="form-group">
      <label class="form-label" for="field-dream">諦めた夢<span class="required">必須</span></label>
      <input type="text" id="field-dream" class="form-input" placeholder="例：プロサッカー選手、小説家、起業家" maxlength="200" autocomplete="off">
      <div class="char-count"><span id="cnt-dream">0</span> / 200</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="field-kingen">一言（金言）<span class="required">必須</span></label>
      <textarea id="field-kingen" class="form-textarea" rows="3" placeholder="例：諦めた理由より、続けた理由が大事だった" maxlength="100"></textarea>
      <div class="char-count"><span id="cnt-kingen">0</span> / 100</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="field-title">肩書き<span class="optional">任意</span></label>
      <input type="text" id="field-title" class="form-input" placeholder="例：元バンドマン、30代会社員、主婦" maxlength="50" autocomplete="off">
      <div class="char-count"><span id="cnt-title">0</span> / 50</div>
    </div>

    <div class="form-group">
      <div class="consent-row">
        <input type="checkbox" id="field-consent">
        <label class="consent-text" for="field-consent">
          投稿内容が「敗北者の金言」ページに掲載される可能性があることに同意します。個人を特定できる情報は含めないようにしてください。
        </label>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">送信する</button>
    <div class="result-msg" id="result-msg"></div>
  </form>

  <div class="note-box">
    ・投稿内容は運営者が確認した後、掲載を検討します<br>
    ・不適切な内容は非掲載になる場合があります<br>
    ・連続投稿を防ぐため、1時間に1回のみ送信できます
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/gokuyou/js/config.js"></script>
<script src="/gokuyou/js/supabase-client.js"></script>
<script>
(function () {
  var THROTTLE_MS = 60 * 60 * 1000; // 1時間
  var STORAGE_KEY = 'gokuyou_kingen_last_submit';

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function updateCount(inputId, countId) {
    var el = document.getElementById(inputId);
    var cnt = document.getElementById(countId);
    if (!el || !cnt) return;
    el.addEventListener('input', function () {
      var len = el.value.length;
      var max = parseInt(el.getAttribute('maxlength') || '0', 10);
      cnt.textContent = len;
      cnt.parentElement.classList.toggle('over', len > max);
    });
  }

  updateCount('field-dream', 'cnt-dream');
  updateCount('field-kingen', 'cnt-kingen');
  updateCount('field-title', 'cnt-title');

  document.getElementById('kingen-form').addEventListener('submit', function (e) {
    e.preventDefault();

    var dream = document.getElementById('field-dream').value.trim();
    var kingen = document.getElementById('field-kingen').value.trim();
    var title = document.getElementById('field-title').value.trim();
    var consent = document.getElementById('field-consent').checked;
    var resultEl = document.getElementById('result-msg');
    var submitBtn = document.getElementById('submit-btn');

    resultEl.style.display = 'none';
    resultEl.className = 'result-msg';

    if (!dream) {
      resultEl.textContent = '「諦めた夢」を入力してください。';
      resultEl.classList.add('error');
      resultEl.style.display = '';
      return;
    }
    if (!kingen) {
      resultEl.textContent = '「一言（金言）」を入力してください。';
      resultEl.classList.add('error');
      resultEl.style.display = '';
      return;
    }
    if (!consent) {
      resultEl.textContent = '掲載への同意チェックが必要です。';
      resultEl.classList.add('error');
      resultEl.style.display = '';
      return;
    }

    // 連投チェック
    try {
      var last = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
      if (Date.now() - last < THROTTLE_MS) {
        var remaining = Math.ceil((THROTTLE_MS - (Date.now() - last)) / 60000);
        resultEl.textContent = 'しばらく時間をおいてから再送信してください（あと約' + remaining + '分）。';
        resultEl.classList.add('error');
        resultEl.style.display = '';
        return;
      }
    } catch (storageErr) { /* プライベートブラウザ等で localStorage が使えない場合はスキップ */ }

    if (!window.supabaseClient) {
      resultEl.textContent = '送信できませんでした。ページを再読み込みして再度お試しください。';
      resultEl.classList.add('error');
      resultEl.style.display = '';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '送信中…';

    var payload = {
      dream: dream,
      kingen: kingen,
      consent: true
    };
    if (title) payload.title = title;

    window.supabaseClient
      .from('kingen_submissions')
      .insert(payload)
      .then(function (res) {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
        if (res.error) {
          resultEl.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
          resultEl.classList.add('error');
        } else {
          try { localStorage.setItem(STORAGE_KEY, String(Date.now())); } catch (e) {}
          resultEl.textContent = '投稿を受け付けました。ありがとうございます。';
          resultEl.classList.add('success');
          document.getElementById('kingen-form').reset();
          document.getElementById('cnt-dream').textContent = '0';
          document.getElementById('cnt-kingen').textContent = '0';
          document.getElementById('cnt-title').textContent = '0';
          if (typeof gtag === 'function') gtag('event', 'kingen_submit');
        }
        resultEl.style.display = '';
      })
      .catch(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
        resultEl.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
        resultEl.classList.add('error');
        resultEl.style.display = '';
      });
  });
})();
</script>
</body>
</html>
