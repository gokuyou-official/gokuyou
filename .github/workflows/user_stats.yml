name: User Stats

# 御供養とやらかしの利用状況を数えて、結果を注記に残す（読み取りのみ・無料）。
# 使う鍵は、もともとサイトで公開されている閲覧用の鍵だけ（秘密の鍵ではない）。

on:
  schedule:
    - cron: '7 11 * * 1'   # 毎週月曜 JST 20:07（週次報告の前）
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Count
        shell: python
        run: |
          import json, urllib.request, collections, datetime as dt
          JST = dt.timezone(dt.timedelta(hours=9))
          now = dt.datetime.now(dt.timezone.utc)
          since = (now - dt.timedelta(days=28)).strftime('%Y-%m-%dT%H:%M:%SZ')
          DBS = {
            'gokuyou': ('fnxzkkzcveujonysoxtp.supabase.co', 'sb_publishable_DPH-TyxDCj6ynUIyoxdFgg_iNwHsBO8'),
            'yarakashi': ('vktzbishexpahdmvvwcb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrdHpiaXNoZXhwYWhkbXZ2d2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjkxODksImV4cCI6MjA5MzgwNTE4OX0.S8gWP0oEd63BYLLqPvmdV0OT9yUpH-locooZsQcVNqs'),
          }
          def get(db, path):
            host, key = DBS[db]
            req = urllib.request.Request(f'https://{host}/rest/v1/{path}',
              headers={'apikey': key, 'Authorization': f'Bearer {key}', 'Range': '0-9999'})
            try:
              with urllib.request.urlopen(req, timeout=30) as r:
                return json.load(r)
            except Exception as e:
              return f'ERR {e}'
          def weekly(rows, col):
            if isinstance(rows, str): return rows
            c = collections.Counter()
            for x in rows:
              t = dt.datetime.fromisoformat(x[col].replace('Z', '+00:00'))
              c[(now - t).days // 7] += 1
            return ' / '.join(f'{c.get(w,0)}' for w in (3,2,1,0)) + '（3週前→今週）'
          out = {
            'やらかし 閲覧数(PV)': weekly(get('yarakashi', f'page_views?select=visited_at&visited_at=gte.{since}'), 'visited_at'),
            '御供養 今日の一歩(公開)': weekly(get('gokuyou', f'public_steps?select=created_at&created_at=gte.{since}'), 'created_at'),
          }
          for name, db, path, col in [('やらかし 閲覧数', 'yarakashi', 'page_views', 'visited_at'),
                                      ('御供養 今日の一歩', 'gokuyou', 'public_steps', 'created_at')]:
            rows = get(db, f'{path}?select={col}&order={col}.desc')
            out[f'{name}(累計・最新日)'] = rows if isinstance(rows, str) else f'{len(rows)}件・{rows[0][col][:10] if rows else "なし"}'
          ev = get('gokuyou', 'events?select=id')
          out['御供養 カレンダー予定(累計)'] = ev if isinstance(ev, str) else len(ev)
          for k, v in out.items():
            print(f'::notice::{k}: {v}')

      # ---- Google アナリティクス（人数）----
      # GA_SA_KEY（サービスアカウントの鍵）が登録されていれば、週ごとの人数を数える。
      # 未登録なら「未設定」と注記するだけで、失敗にはしない。
      - name: Install GA client
        run: pip install -q google-auth requests
      - name: GA report
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
        shell: python
        run: |
          import os, json
          raw = os.environ.get('GA_SA_KEY', '')
          if not raw:
            print('::notice::GA: 未設定（GA_SA_KEY が登録されていません）'); raise SystemExit(0)
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          creds = service_account.Credentials.from_service_account_info(
            json.loads(raw), scopes=['https://www.googleapis.com/auth/analytics.readonly'])
          s = AuthorizedSession(creds)
          pid = os.environ.get('GA_PROPERTY_ID', '').strip()
          props = []
          if pid:
            props = [(pid, '御供養')]
          else:
            r = s.get('https://analyticsadmin.googleapis.com/v1beta/accountSummaries')
            if r.status_code != 200:
              print(f'::warning::GA: プロパティ一覧を取得できません HTTP {r.status_code} {r.text[:200]}'); raise SystemExit(0)
            for a in r.json().get('accountSummaries', []):
              for p in a.get('propertySummaries', []):
                props.append((p['property'].split('/')[-1], p.get('displayName', '')))
            if not props:
              print('::warning::GA: 閲覧できるプロパティがありません（GAの「アクセス管理」にサービスアカウントを追加してください）'); raise SystemExit(0)
          for pid, label in props:
            url = f'https://analyticsdata.googleapis.com/v1beta/properties/{pid}:runReport'
            weeks = []
            for w in (3, 2, 1, 0):
              body = {'dateRanges': [{'startDate': f'{7*w+7}daysAgo', 'endDate': f'{7*w+1}daysAgo'}],
                      'metrics': [{'name': 'activeUsers'}, {'name': 'newUsers'}, {'name': 'screenPageViews'}]}
              r = s.post(url, json=body)
              if r.status_code != 200:
                print(f'::warning::GA {label}: 取得失敗 HTTP {r.status_code} {r.text[:200]}'); break
              rows = r.json().get('rows', [])
              v = [x['value'] for x in rows[0]['metricValues']] if rows else ['0', '0', '0']
              weeks.append('/'.join(v))
            else:
              print(f'::notice::GA {label}({pid}) 人数/新規/閲覧 週ごと(3週前→先週): ' + ' | '.join(weeks))
              body = {'dateRanges': [{'startDate': '7daysAgo', 'endDate': 'yesterday'}],
                      'dimensions': [{'name': 'sessionSource'}], 'metrics': [{'name': 'activeUsers'}],
                      'orderBys': [{'metric': {'metricName': 'activeUsers'}, 'desc': True}], 'limit': 5}
              r = s.post(url, json=body)
              if r.status_code == 200:
                src = ', '.join(f"{x['dimensionValues'][0]['value']}={x['metricValues'][0]['value']}" for x in r.json().get('rows', []))
                print(f'::notice::GA {label} 先週の流入元: {src or "なし"}')
