name: Supabase Keepalive

# 無料プランのSupabaseは約1週間アクセスがないと自動で一時停止する。
# 毎日、軽い読み取りを1回送り、御供養とやらかしのデータベースが止まらないようにする。
# ここに書いているのは、もともとサイトで公開されている閲覧用の鍵だけ（秘密の鍵ではない）。

on:
  schedule:
    - cron: '17 3 * * *'   # 毎日 JST 12:17
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          set +e
          fail=0
          ping_one () {
            name="$1"; host="$2"; path="$3"; key="$4"
            ip=$(getent hosts "$host" | awk '{print $1}' | head -1)
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --retry 2 \
              "https://$host$path" -H "apikey: $key" -H "Authorization: Bearer $key")
            rc=$?
            echo "::notice::$name DNS=${ip:-なし} HTTP=$code curl=$rc"
            if [ "$rc" != "0" ] || [ "$code" -ge 500 ]; then fail=1; fi
          }
          ping_one "御供養" "fnxzkkzcveujonysoxtp.supabase.co" "/rest/v1/public_steps?select=id&limit=1" "sb_publishable_DPH-TyxDCj6ynUIyoxdFgg_iNwHsBO8"
          ping_one "やらかし" "vktzbishexpahdmvvwcb.supabase.co" "/rest/v1/records?select=id&limit=1" "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrdHpiaXNoZXhwYWhkbXZ2d2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjkxODksImV4cCI6MjA5MzgwNTE4OX0.S8gWP0oEd63BYLLqPvmdV0OT9yUpH-locooZsQcVNqs"
          exit $fail
